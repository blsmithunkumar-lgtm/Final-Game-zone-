name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: APK banao
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk GameZone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameZone-APK
          path: GameZone.apk
      - name: Release mein daalo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk GameZone.apk --title "Game Zone APK 🎁" --notes "A Gift to Mithun from Deepak. GameZone.apk download karke install karo." --latest

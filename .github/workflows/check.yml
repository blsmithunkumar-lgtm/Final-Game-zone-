name: Godot check
on:
  push:
    branches: [catrun-godot]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          V=4.7.2
          for U in https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip https://github.com/godotengine/godot-builds/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip; do
            curl -fsSL -o godot.zip "$U" && break
          done
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && chmod +x godot && ./godot --version
      - name: Import
        run: ./godot --headless --path . --import 2>&1 | tee import.log || true
      - name: Smoke test
        run: |
          timeout 60 ./godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee run.log || true
          grep -E "SCRIPT ERROR|Parse Error|ERROR" run.log import.log && echo "::warning::errors found" || true
          grep -q SMOKE_OK run.log
      - name: Screenshots
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y xvfb mesa-utils libgl1-mesa-dri > /dev/null
          xvfb-run -s "-screen 0 720x1280x24" timeout 200 ./godot --path . --rendering-method gl_compatibility --resolution 720x1280 --script res://tests/shot.gd 2>&1 | tail -20 || true
          ls -la shots || true
      - name: Save screenshots to branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch origin catrun-shots || true
          mkdir -p /tmp/s && cp shots/*.png /tmp/s/
          git checkout --orphan catrun-shots-tmp && git rm -rfq --cached . && git clean -fdq -e godot
          cp /tmp/s/*.png . && git add *.png && git commit -qm "shots" && git push -f origin HEAD:catrun-shots
